<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가위바위보 마스터</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px; }
        .card { background: #1e293b; max-width: 400px; margin: 0 auto; padding: 30px; border-radius: 12px; }
        button { padding: 10px 15px; font-size: 1.2rem; margin: 5px; background: #38bdf8; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>가위바위보 마스터</h2>
        <p id="res">버튼을 눌러 대결하세요!</p>
        <button onclick="play('가위')">✌️ 가위</button>
        <button onclick="play('바위')">✊ 바위</button>
        <button onclick="play('보')">✋ 보</button>
        <p><a href="../index.html" style="color:#38bdf8; display:inline-block; margin-top:20px;">메인으로 돌아가기</a></p>
    </div>
    <script>
        function play(user) {
            let arr = ['가위', '바위', '보'];
            let com = arr[Math.floor(Math.random() * 3)];
            let res = "";
            if(user === com) res = `무승부! (컴퓨터: ${com})`;
            else if((user==='가위'&&com==='보') || (user==='바위'&&com==='가위') || (user==='보'&&com==='바위')) 
                res = `승리! (컴퓨터: ${com})`;
            else res = `패배! (컴퓨터: ${com})`;
            document.getElementById('res').innerText = res;
        }
    </script>
</body>
</html>
