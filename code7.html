<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 총쏘기 게임</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: #2b2b2b;
            border: 4px solid #fff;
            overflow: hidden;
            cursor: crosshair;
        }
        .target {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #ff4757;
            border-radius: 50%;
            border: 3px solid #fff;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .target::after {
            content: '';
            width: 16px;
            height: 16px;
            background: #ff6b81;
            border-radius: 50%;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            width: 800px;
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div>점수: <span id="score">0</span></div>
        <div>남은 시간: <span id="timer">30</span>초</div>
    </div>

    <div id="game-container"></div>

    <script>
        const container = document.getElementById('game-container');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');

        let score = 0;
        let timeLeft = 30;
        let gameInterval;
        let targetInterval;

        // 게임 시작
        function startGame() {
            createTarget();
            
            // 타겟 생성 주기 (1초마다)
            targetInterval = setInterval(createTarget, 800);

            // 타이머 (1초마다 감소)
            gameInterval = setInterval(() => {
                timeLeft--;
                timerEl.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // 타겟 생성 함수
        function createTarget() {
            const target = document.createElement('div');
            target.classList.add('target');

            // 게임판 내부 랜덤 위치 설정 (테두리 여유 40px)
            const x = Math.random() * (container.clientWidth - 80) + 40;
            const y = Math.random() * (container.clientHeight - 80) + 40;

            target.style.left = `${x}px`;
            target.style.top = `${y}px`;

            // 타겟 클릭 시 점수 획득 및 삭제
            target.addEventListener('mousedown', (e) => {
                e.stopPropagation(); // 컨테이너 클릭 이벤트 전파 방지
                score += 10;
                scoreEl.textContent = score;
                target.remove();
            });

            container.appendChild(target);

            // 1.5초 동안 안 맞추면 사라짐
            setTimeout(() => {
                if (target.parentElement) {
                    target.remove();
                }
            }, 1500);
        }

        // 게임 종료 함수
        function endGame() {
            clearInterval(gameInterval);
            clearInterval(targetInterval);
            
            // 남은 타겟들 제거
            document.querySelectorAll('.target').forEach(t => t.remove());

            // 결과 표시
            setTimeout(() => {
                alert(`게임 종료! 최종 점수: ${score}점`);
                location.reload(); // 새로고침하여 재시작
            }, 100);
        }

        // 게임 시작 실행
        startGame();
    </script>

</body>
</html>
